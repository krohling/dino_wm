defaults:
  - _self_
  - encoder: qwen3_vl
  - predictor: vit_oneshot

# Path to preprocessed env data (per-episode .pt files + manifest.json)
data_path: ${oc.env:DATASET_DIR}/lt

seed: 0
img_size: 448
obs_horizon: 2
max_action_horizon: 16
eval_horizons: [1, 2, 4, 8, 16]
split_ratio: 0.9
include_ood: false
normalize_action: true
n_rollout: null

training:
  epochs: 50
  batch_size: 8
  val_batch_size: 8
  num_workers: 4
  lr: 5e-4
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 10
  save_every: 5

wandb:
  project: swm-next-dino-wm
  entity: kevin_ai
  name: null  # default: hydra run dir name

hydra:
  run:
    dir: ${oc.env:DINO_WM_RUN_BASE,./oneshot_runs}/${now:%Y-%m-%d_%H-%M-%S}
